<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- GoPublic-style GP monogram. Dark teal-navy plate to read on both
       light and dark browser tab backgrounds; white wordmark. -->
  <rect width="64" height="64" rx="12" ry="12" fill="#0F4C5C"/>
  <g fill="#FFFFFF" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="700">
    <text x="32" y="44" text-anchor="middle" font-size="32" letter-spacing="-1.5">GP</text>
  </g>
</svg>
